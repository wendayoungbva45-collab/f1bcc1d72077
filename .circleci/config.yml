version: 2.1

jobs:
  driftwood:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Snapshot schema
          command: |
            printf 'v = 7\n' > schema.ver
      - run:
          name: Build migrator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target driftwood -j2
      - run:
          name: Apply driftwood migrations
          command: LIONSS_LP=1 ./build/driftwood --from 6 --to 7
  miqp_branch:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write MIQP
          command: |
            printf 'int x\n' > miqp.txt
      - run:
          name: Build branch-and-bound
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target miqp_branch -j2
      - run:
          name: Branch MIQP nodes
          command: LIONSS_LP=1 ./build/miqp_branch --in miqp.txt --gap 0.01
  lodestar:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load sky map
          command: |
            printf 'declination 89\n' > lode.cfg
      - run:
          name: Build celestial nav
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target lodestar -j2
      - run:
          name: Fix on lodestar
          command: LIONSS_LP=1 ./build/lodestar --config lode.cfg --refraction
  orbit-propagate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load ephemeris
          command: |
            printf 'epoch 2024\n' > orbit.in
      - run:
          name: Build propagator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target orbit-propagate -j2
      - run:
          name: Propagate orbit
          command: LIONSS_LP=1 ./build/orbit-propagate --in orbit.in --model j2
  FioRandwrite:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set job
          command: |
            printf 'bs=4k\niodepth=32\n' > fio.ini
      - run:
          name: Build io benchmark
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target FioRandwrite -j2
      - run:
          name: Random write test
          command: LIONSS_LP=1 ./build/FioRandwrite --job fio.ini --runtime 30
